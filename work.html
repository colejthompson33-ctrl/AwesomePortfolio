<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cole Thompson — Portfolio</title>
  
  <!-- Preload critical font -->
  <link rel="preload" href="fonts/HelveticaNowDisplay-Regular.woff2" as="font" type="font/woff2" crossorigin>
  
  <!-- Shared Mobile Optimizations -->
  <link rel="stylesheet" href="css/mobile-optimizations.css">
  
  <style>
    /* ==========================================================================
       1. Reset & Global Setup (Strict Non-Scrolling Viewport)
       ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      position: fixed;
      inset: 0;
      overflow: hidden !important;
      touch-action: none;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Edge-Proximity Glowing Window Outline */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9990;
      border: 1px solid rgba(0, 210, 255, 0.9);
      box-shadow: 
        inset 0 0 10px rgba(0, 210, 255, 0.6),
        inset 0 0 20px rgba(180, 255, 60, 0.4),
        0 0 15px rgba(0, 210, 255, 0.7);
      opacity: var(--edge-glow-opacity, 0);
      transition: opacity 0.2s ease;
      
      -webkit-mask-image: radial-gradient(
        70px circle at var(--bg-mouse-x, 50vw) var(--bg-mouse-y, 50vh),
        black 0%,
        rgba(0, 0, 0, 0.8) 40%,
        transparent 80%
      );
      mask-image: radial-gradient(
        70px circle at var(--bg-mouse-x, 50vw) var(--bg-mouse-y, 50vh),
        black 0%,
        rgba(0, 0, 0, 0.8) 40%,
        transparent 80%
      );
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* ==========================================================================
       2. Top Navigation
       ========================================================================== */
    .top-nav {
      position: fixed;
      top: 2.2rem;
      left: 2.5rem;
      z-index: 2000;
    }

    .main-nav {
      display: flex;
      gap: 1.5rem;
      font-size: 0.9rem;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.45);
    }

    /* Mobile Menu Toggle Button */
    .mobile-menu-toggle {
      display: none;
    }

    /* Mobile Menu Panel */
    .mobile-menu {
      position: fixed;
      top: 0;
      right: 0;
      width: 100%;
      height: 100vh;
      background: rgba(0, 0, 0, 0.98);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .mobile-menu[aria-hidden="false"] {
      opacity: 1;
      visibility: visible;
    }

    .mobile-nav {
      display: flex;
      flex-direction: column;
      gap: 2rem;
      text-align: center;
    }

    .mobile-nav-link {
      font-size: 2rem;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.6);
      text-decoration: none;
      transition: color 0.2s ease, transform 0.2s ease;
      letter-spacing: -0.02em;
      padding: 1rem 1.5rem;
      min-height: 48px;
      min-width: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    @media (hover: hover) {
      .mobile-nav-link:hover {
        color: #ffffff;
        transform: scale(1.05);
      }
    }

    .mobile-nav-link.active {
      color: #ffffff;
    }

    .nav-link {
      transition: color 0.2s ease, text-shadow 0.3s ease;
      cursor: pointer;
      position: relative;
    }

    @media (hover: hover) {
      .nav-link:hover {
        color: #ffffff;
        text-shadow: 0 0 12px rgba(0, 210, 255, 0.8), 0 0 20px rgba(180, 255, 60, 0.6);
      }
    }

    .nav-link.active {
      color: rgba(255, 255, 255, 0.9);
    }

    /* ==========================================================================
       3. Main Layout & Stream Structure
       ========================================================================== */
    .portfolio-layout {
      display: flex;
      width: 100%;
      max-width: min(1600px, 95vw);
      margin: 0 auto;
      height: 100vh;
      position: relative;
      transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: auto;
      overflow: visible;
    }

    body.is-project-mode .content-left {
      opacity: 0;
      pointer-events: none;
    }

    .content-left {
      width: clamp(45%, 50%, 52%);
      height: 100%;
      padding: clamp(4rem, 6vw, 7rem) clamp(2rem, 4vw, 4rem) clamp(2rem, 3vw, 3rem) 2.5rem;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: clamp(2rem, 4vw, 3.5rem);
      z-index: 10;
      transition: opacity 0.5s ease;
    }

    .project-container {
      width: clamp(45%, 50%, 52%);
      height: 100%;
      padding: clamp(4rem, 6vw, 7rem) clamp(2rem, 4vw, 4rem) clamp(2rem, 3vw, 3rem) 2.5rem;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: clamp(2rem, 4vw, 3.5rem);
      z-index: 200;
      pointer-events: auto;
    }

    .content-right {
      width: clamp(45%, 50%, 48%);
      height: 100%;
      position: relative;
      overflow: visible;
      perspective: 1400px;
      z-index: 20;
    }

    body.is-project-mode .content-right {
      z-index: 150;
      pointer-events: none !important;
    }

    .hero-container,
    .project-header {
      min-height: 120px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }

    .name,
    .project-title {
      font-size: clamp(2.5rem, 5vw, 4.2rem);
      font-weight: 500;
      letter-spacing: -0.02em;
      line-height: 1.05;
      margin-bottom: 0;
      color: #ffffff;
    }

    .view-project-btn,
    .go-back-btn,
    .click-hint {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.75rem;
      padding: 0.5rem 0.75rem;
      font-size: 0.9rem;
      font-weight: 400;
      font-family: inherit;
      color: #ffffff;
      background: transparent;
      border: none;
      cursor: pointer;
      width: fit-content;
      min-height: 44px;
      min-width: 44px;
      transition: opacity 0.2s ease, transform 0.2s ease, text-shadow 0.3s ease;
      box-shadow: none;
      text-decoration: underline;
      text-underline-offset: 4px;
      text-decoration-thickness: 1px;
      position: relative;
      z-index: 2500 !important;
      pointer-events: auto !important;
    }

    .click-hint {
      cursor: default;
    }

    @media (hover: hover) {
      .view-project-btn:hover,
      .go-back-btn:hover,
      .click-hint:hover {
        opacity: 1;
        transform: translateY(-1px);
        text-shadow: 0 0 10px rgba(0, 210, 255, 0.9), 0 0 18px rgba(180, 255, 60, 0.7);
      }
    }

    .sections-container {
      display: flex;
      flex-direction: column;
      gap: 2.5rem;
      max-width: 100%;
      align-self: flex-start;
    }

    .section-grid {
      display: grid;
      grid-template-columns: 1fr clamp(100px, 12vw, 160px);
      gap: 2rem;
      align-items: start;
      max-width: 100%;
    }
    
    .section-content {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      font-size: 0.825rem;
      line-height: 1.5;
      color: #a1a1a1;
      font-weight: 400;
      user-select: text;
      -webkit-user-select: text;
    }

    .section-label {
      font-size: 0.825rem;
      font-weight: 500;
      color: #ffffff;
      text-align: left;
      letter-spacing: -0.01em;
    }

    .contact-email {
      font-size: 1.25rem;
      font-weight: 400;
      margin-top: auto;
    }

    .contact-email a {
      text-decoration: underline;
      text-underline-offset: 6px;
      text-decoration-thickness: 1px;
      color: #ffffff;
      transition: opacity 0.2s ease, text-shadow 0.3s ease;
    }

    @media (hover: hover) {
      .contact-email a:hover {
        opacity: 1;
        text-shadow: 0 0 12px rgba(0, 210, 255, 0.8), 0 0 20px rgba(180, 255, 60, 0.6);
      }
    }

    /* 3D Stream Container */
    .image-stream-container {
      position: absolute;
      top: -20vh;
      right: -5vw;
      width: 110%;
      height: 140vh;
      transform-style: preserve-3d;
      transform: rotateZ(8deg) rotateY(-18deg) rotateX(4deg);
      transform-origin: top right;
      cursor: grab;
      z-index: 60;
      will-change: transform;
    }

    body.is-project-mode .image-stream-container {
      pointer-events: none !important;
      cursor: default;
      visibility: hidden !important; /* Forces Safari to hide the 3D container */
      transform: none !important;    /* Flattens the 3D perspective layer for WebKit */
    }

    .image-stream-container:active {
      cursor: grabbing;
    }

    .image-stream {
      position: relative;
      width: 100%;
      height: 100%;
      will-change: transform;
      transform-style: preserve-3d;
    }

    .stream-card {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      background-color: transparent;
      cursor: pointer;
      transform-style: preserve-3d;
      backface-visibility: hidden;
      -webkit-font-smoothing: antialiased;
      will-change: transform;
      transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
      z-index: 10;
      opacity: 1 !important;
      pointer-events: auto;
      padding: 0px;
    }

    .stream-card.is-selected {
      cursor: zoom-in;
    }

.stream-card-inner {
  position: relative;
  width: 100%;
  height: 100%;
  background-color: #000000;
  overflow: hidden;
  box-shadow: -10px 20px 40px rgba(0, 0, 0, 0.8);
  border-radius: 6px;
  border: 1px solid transparent;
  transform-style: preserve-3d;
  will-change: transform, border-color, box-shadow;
  transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1),
              border-color 0.35s ease,
              box-shadow 0.35s ease;
  transform-origin: center center;
  z-index: 2;
  box-sizing: border-box;
}

@media (hover: hover) {
  .stream-card:hover .stream-card-inner {
    transform: scale(1.02);
    border-color: rgba(0, 210, 255, 0.85);
    box-shadow: -15px 30px 60px rgba(0, 0, 0, 0.9);
  }
}

    /* Card Text Overlay */
    .card-overlay-text {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 2.5rem 1.25rem 1.25rem 1.25rem;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.92) 0%, rgba(0, 0, 0, 0.5) 60%, transparent 100%);
      color: #ffffff;
      pointer-events: none;
      z-index: 15;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      text-align: left;
    }

    .card-overlay-title {
      font-size: clamp(1.1rem, 2vw, 1.5rem);
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
    }

    .card-overlay-desc {
      font-size: clamp(0.75rem, 1.2vw, 0.875rem);
      color: rgba(255, 255, 255, 0.8);
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      font-weight: 400;
    }

    .card-action-badge {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #ffffff;
      font-size: 0.75rem;
      font-weight: 500;
      padding: 0.4rem 0.8rem;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      opacity: 0;
      transform: translateY(-6px);
      transition: opacity 0.25s ease, transform 0.25s ease;
      pointer-events: none;
      z-index: 20;
    }

    @media (hover: hover) {
      .stream-card:hover .card-action-badge {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes borderPulse {
      0% {
        box-shadow: -15px 25px 50px rgba(0, 0, 0, 0.9), 0 0 12px rgba(0, 210, 255, 0.3);
      }
      50% {
        box-shadow: -20px 35px 65px rgba(0, 0, 0, 0.95), 0 0 24px rgba(180, 255, 0, 0.3);
      }
      100% {
        box-shadow: -15px 25px 50px rgba(0, 0, 0, 0.9), 0 0 12px rgba(0, 210, 255, 0.3);
      }
    }

    .stream-card.is-selected .stream-card-inner {
      animation: borderPulse 2s infinite ease-in-out;
    }

    .stream-card.is-selected {
      z-index: 50;
    }

    body.is-project-mode .stream-card:not(.is-active-project) {
      opacity: 0 !important;
      pointer-events: none !important;
      transition: opacity 0.3s ease;
    }

    body.is-project-mode .stream-card.is-active-project {
      opacity: 0 !important;
      pointer-events: none !important;
      transition: transform 1.15s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.7s ease 0.3s !important;
    }

    .stream-image {
      width: 100%;
      height: 100%;
      max-width: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
      aspect-ratio: 16/9;
    }

    .page-transition-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      z-index: 9999;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    body.is-exiting .page-transition-overlay {
      opacity: 1;
      pointer-events: auto;
    }

    /* ==========================================================================
       4. Mobile Specific Viewport Adjustments (< 768px)
       ========================================================================== */
    @media (max-width: 767px) {
      .portfolio-layout {
        flex-direction: column;
      }
      
      .content-left {
        display: none !important;
      }
      
      .content-right {
        width: 100%;
        max-width: 100vw;
        display: block !important;
        height: 100vh;
        perspective: none;
        overflow: hidden;
      }

      .image-stream-container {
        top: 0;
        left: 0;
        right: 0;
        width: 100%;
        max-width: 100vw;
        height: 100vh;
        margin: 0 auto;
        transform: none !important;
        transform-origin: center center;
      }

      .stream-card {
        padding: 6px;
        margin: 0 auto;
        left: 0 !important;
        right: 0 !important;
        width: 100% !important;
        max-width: 100% !important;
      }

      .card-overlay-desc {
        display: none !important;
      }

      .card-action-badge {
        opacity: 1;
        transform: translateY(0);
        font-size: 0.7rem;
        padding: 0.3rem 0.6rem;
      }

      .top-nav {
        top: 1rem;
        left: 1.25rem;
        right: 1.25rem;
      }
      
      .mobile-menu-toggle {
        display: flex;
      }
      
      .main-nav {
        display: none;
      }

      .project-container {
        width: 100%;
        padding: 1.25rem;
      }

      body.is-project-mode .mobile-menu-toggle {
        display: none !important;
      }

      body.is-project-mode .go-back-btn {
        display: none !important;
      }

      .mobile-back-btn {
        background: transparent;
        border: none;
        color: #ffffff;
        font-size: 1.5rem;
        font-weight: 500;
        cursor: pointer;
        padding: 0.5rem;
        min-width: 44px;
        min-height: 44px;
        display: none;
        align-items: center;
        justify-content: center;
        position: fixed;
        top: 1rem;
        left: 1.25rem;
        z-index: 5000;
        pointer-events: auto !important;
      }

      body.is-project-mode .mobile-back-btn {
        display: inline-flex !important;
      }

      body.is-project-mode .project-header {
        display: flex !important;
        align-items: center;
        justify-content: flex-end;
        position: fixed;
        top: 1rem;
        right: 1.25rem;
        left: auto;
        margin: 0 !important;
        padding: 0;
        z-index: 2999;
        min-height: auto;
      }

      body.is-project-mode .project-title {
        font-size: clamp(0.95rem, 3.8vw, 1.35rem) !important;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: calc(100vw - 6rem);
        text-align: right;
        margin: 0;
      }

      #projectLeft {
        display: none !important;
      }

      .project-section-grid {
        grid-template-columns: 1fr;
        gap: 0.5rem;
      }

      .project-section-label {
        text-align: left;
        order: -1;
      }

      .project-detail-view {
        flex-direction: column;
        overflow-y: auto;
      }

      .project-container {
        z-index: 3000;
        pointer-events: auto !important;
      }
    }

    @media (min-width: 768px) {
      .mobile-menu-toggle {
        display: none;
      }
      
      .mobile-menu {
        display: none;
      }

      #mobileBackBtn,
      .mobile-back-btn {
        display: none !important;
      }
    }
    
    @media (min-width: 768px) and (max-width: 1023px) {
      .content-left {
        width: 55%;
        padding: clamp(3rem, 5vw, 5rem) clamp(2rem, 3vw, 3rem) clamp(2rem, 3vw, 3rem) 2.5rem;
      }
      
      .content-right {
        width: 45%;
      }
      
      .project-container {
        width: 45%;
        padding: clamp(3rem, 5vw, 5rem) clamp(2rem, 3vw, 3rem) clamp(2rem, 3vw, 3rem) 2.5rem;
      }
      
      .name,
      .project-title {
        font-size: clamp(2.5rem, 4vw, 3.5rem);
      }
    }
    
    @media (min-width: 1024px) and (max-width: 1439px) {
      .content-left {
        padding: clamp(4rem, 5vw, 6rem) clamp(2.5rem, 3vw, 3.5rem) clamp(2rem, 3vw, 3rem) 2.5rem;
      }
      
      .project-container {
        padding: clamp(4rem, 5vw, 6rem) clamp(2.5rem, 3vw, 3.5rem) clamp(2rem, 3vw, 3rem) 2.5rem;
      }
      
      .name,
      .project-title {
        font-size: clamp(3rem, 4vw, 4rem);
      }
    }
    
    @media (min-width: 1440px) {
      .section-grid {
        grid-template-columns: 1fr clamp(100px, 8vw, 140px);
      }
      
      .name,
      .project-title {
        font-size: clamp(3.5rem, 4vw, 4.5rem);
      }
    }

    /* ==========================================================================
       5. Project Detail View & Dynamic Collage Pinboard
       ========================================================================== */
    .project-detail-view {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: transparent;
      z-index: 150;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.6s step-end;
      display: flex;
      overflow: hidden;
    }

    body.is-project-mode .project-detail-view {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), visibility 0s step-start;
    }

    .project-left {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 2.5rem;
    }

    .project-section-grid {
      display: grid;
      grid-template-columns: 1fr clamp(100px, 12vw, 160px);
      gap: 2rem;
      align-items: start;
      max-width: 90%;
    }

    .project-section-content {
      font-size: 0.825rem;
      line-height: 1.5;
      color: #a1a1a1;
      font-weight: 400;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .project-section-label {
      font-size: 0.825rem;
      font-weight: 500;
      color: #ffffff;
      text-align: left;
      letter-spacing: -0.01em;
    }

    /* Pinboard Collage Container */
    .pinboard-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1200;
      opacity: 0;
      transition: opacity 0.6s ease 0.3s;
      overflow: visible;
    }

    body.is-project-mode .pinboard-container {
      opacity: 1;
      pointer-events: none;
    }

    .pinboard-grid-wrapper {
      position: absolute;
      top: 5vh;
      left: min(480px, 42vw);
      right: 3vw;
      bottom: 5vh;
      width: auto;
      height: 90vh;
      pointer-events: none;
      overflow: visible;
      z-index: 180;
    }

    body.is-project-mode .pinboard-grid-wrapper {
      pointer-events: auto;
    }

    @media (max-width: 767px) {
      .pinboard-grid-wrapper {
        position: relative;
        top: 0;
        left: 0;
        right: 0;
        width: 100%;
        height: auto;
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        padding: 20px 16px 100px 16px;
      }

      .pinboard-item {
        position: relative !important;
        top: auto !important;
        left: auto !important;
        width: calc(50% - 8px) !important;
        height: auto !important;
      }
    }

    .pinboard-item {
      position: absolute;
      pointer-events: auto;
      cursor: zoom-in;
      user-select: none;
      background-color: transparent;
      transition: filter 0.25s ease;
      touch-action: none;
      will-change: transform;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @media (hover: hover) {
      .pinboard-item:hover {
        filter: drop-shadow(0 20px 35px rgba(0, 0, 0, 0.95)) drop-shadow(0 0 10px rgba(0, 210, 255, 0.25));
      }
    }

    .pinboard-item img {
      width: 100%;
      height: 100%;
      max-width: 100%;
      object-fit: contain;
      pointer-events: none;
      display: block;

    const mobileNavLinks = document.querySelectorAll('.mobile-nav-link');
    
    function toggleMobileMenu() {
      const isExpanded = mobileMenuToggle.getAttribute('aria-expanded') === 'true';
      mobileMenuToggle.setAttribute('aria-expanded', !isExpanded);
      mobileMenu.setAttribute('aria-hidden', isExpanded);
    }
    
    function closeMobileMenu() {
      mobileMenuToggle.setAttribute('aria-expanded', 'false');
      mobileMenu.setAttribute('aria-hidden', 'true');
    }
    
    if (mobileMenuToggle && mobileMenu) {
      mobileMenuToggle.addEventListener('click', toggleMobileMenu);
      mobileNavLinks.forEach(link => link.addEventListener('click', closeMobileMenu));
      mobileMenu.addEventListener('click', (e) => {
        if (e.target === mobileMenu) closeMobileMenu();
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && mobileMenuToggle.getAttribute('aria-expanded') === 'true') {
          closeMobileMenu();
          mobileMenuToggle.focus();
        }
      });
    }
    
    const EDGE_THRESHOLD = 90;
    let mouseX = 0, mouseY = 0;
    let glowTicking = false;

    // Mouse tracking & Edge glow with animation frame throttling
    window.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;

      if (!glowTicking) {
        requestAnimationFrame(() => {
          document.body.style.setProperty('--bg-mouse-x', `${mouseX}px`);
          document.body.style.setProperty('--bg-mouse-y', `${mouseY}px`);

          const minEdgeDist = Math.min(mouseX, window.innerWidth - mouseX, mouseY, window.innerHeight - mouseY);

          if (minEdgeDist < EDGE_THRESHOLD) {
            const edgeFactor = 1 - (minEdgeDist / EDGE_THRESHOLD);
            document.body.style.setProperty('--edge-glow-opacity', edgeFactor.toFixed(2));
          } else {
            document.body.style.setProperty('--edge-glow-opacity', '0');
          }
          glowTicking = false;
        });
        glowTicking = true;

        lightboxNextBtn.classList.add('is-hidden');
      } else {
        lightboxNextBtn.classList.remove('is-hidden');
      }
    }

    function openLightbox(index) {

    function calculateDimensions() {
      if (!streamContainer) return;
      const containerWidth = streamContainer.clientWidth;
      cardHeight = containerWidth * (9 / 16);
      itemTotalHeight = cardHeight + GAP;
      lastRenderedStart = -999; // Force re-render on resize
    }

    function renderVisibleCards(force = false) {
      const viewportHeight = window.innerHeight * 1.5;
      const minVisibleY = -currentY - (itemTotalHeight * 4);
      const maxVisibleY = -currentY + viewportHeight + (itemTotalHeight * 4);

      const startIdx = Math.floor(minVisibleY / itemTotalHeight);
      const endIdx = Math.ceil(maxVisibleY / itemTotalHeight);

      // Only rebuild DOM nodes if viewport range changes or forced
      if (!force && startIdx === lastRenderedStart && endIdx === lastRenderedEnd) {
        return;
      }
      lastRenderedStart = startIdx;
      lastRenderedEnd = endIdx;

      const neededKeys = new Set();

      for (let i = startIdx; i <= endIdx; i++) {
        neededKeys.add(i);

        let cardNode = activeCardsMap.get(i);
        if (!cardNode) {
          const imageIndex = ((i % streamImages.length) + streamImages.length) % streamImages.length;
          const imageData = streamImages[imageIndex];

          cardNode = document.createElement('div');
          cardNode.className = 'stream-card';
          cardNode.dataset.key = i;
          cardNode.style.height = `${cardHeight}px`;

          const cardInner = document.createElement('div');
          cardInner.className = 'stream-card-inner';

          const img = createOptimizedImage(
            imageData.src,
            imageData.fallback,
            imageData.title,
            'stream-image',
            'lazy',
            { aspectRatio: '16/9' }
          );

          const overlayText = document.createElement('div');
          overlayText.className = 'card-overlay-text';
          overlayText.innerHTML = `
            <h3 class="card-overlay-title">${imageData.title}</h3>
            <p class="card-overlay-desc">${imageData.about ? imageData.about.paragraphs[0] : ''}</p>
          `;

          const actionBadge = document.createElement('div');
          actionBadge.className = 'card-action-badge';
          actionBadge.textContent = 'View Project ↗';

          cardInner.appendChild(img);
          cardInner.appendChild(overlayText);
          cardInner.appendChild(actionBadge);
          cardNode.appendChild(cardInner);

          cardNode.addEventListener('click', (e) => {
            if (pointerMoved) return;
            e.stopPropagation();
            
            if (selectedKey === i || window.innerWidth < 768) {
              if (!isProjectViewMode) {
                openProjectView(i, cardNode);
              }
            } else {
              selectImage(i);
            }
          });

          imageStream.appendChild(cardNode);
          activeCardsMap.set(i, cardNode);
        }

        let cardPosY = i * itemTotalHeight;
        if (selectedKey !== null) {
          if (i < selectedKey) {
            cardPosY -= PUSH_OFFSET;
          } else if (i > selectedKey) {
            cardPosY += PUSH_OFFSET;
          }
        }

        const badgeNode = cardNode.querySelector('.card-action-badge');
        if (badgeNode) {
          badgeNode.textContent = (selectedKey === i) ? 'Open Project ↗' : 'View Project ↗';
        }

        const targetTransform = (isProjectViewMode && i === activeCardOriginalKey)
          ? `translate3d(150vw, ${cardPosY}px, 0)`
          : `translate3d(0, ${cardPosY}px, 0)`;

        if (cardNode.dataset.lastTransform !== targetTransform) {
          cardNode.style.transform = targetTransform;
          cardNode.dataset.lastTransform = targetTransform;
        }

        if (selectedKey === i) {
          cardNode.classList.add('is-selected');
        } else {
          cardNode.classList.remove('is-selected');
        }

        // Sync is-active-project class during continuous rendering
        if (isProjectViewMode && i === activeCardOriginalKey) {
          cardNode.classList.add('is-active-project');
        } else {
          cardNode.classList.remove('is-active-project');
        }
      }

      activeCardsMap.forEach((node, key) => {
        if (!neededKeys.has(key) && key !== activeCardOriginalKey) {
          node.remove();
          activeCardsMap.delete(key);
        }
      });
    }

    function buildCollageLayout(items) {
      const gridWrapper = document.getElementById('pinboardGridWrapper');

          setNaturalAspectRatio(img);

          pinboardItem.appendChild(img);

          // Use custom rotation if provided, otherwise no rotation for mobile
          const mobileRotation = item.rotation !== undefined ? item.rotation : 0;
          makeDraggableAndZoomable(pinboardItem, idx, mobileRotation);
        });
      } else {
        const anchorPoints = [
          { left: 40, top: 8 },   { left: 70, top: 10 }, { left: 38, top: 35 },
          { left: 74, top: 38 },  { left: 35, top: 62 }, { left: 68, top: 65 },
          { left: 48, top: 18 },  { left: 78, top: 22 }, { left: 52, top: 48 }
        ];

        items.forEach((item, idx) => {
          const pinboardItem = document.createElement('div');
          pinboardItem.className = `pinboard-item ${item.isPng ? 'is-png' : ''}`;

          // Check if item has custom coordinates, otherwise use defaults
          const hasCustomCoords = item.left !== undefined || item.top !== undefined || 
                                  item.rotation !== undefined || item.size !== undefined;

          let finalLeft, finalTop, finalRotation, finalSizeVW;

          if (hasCustomCoords) {
            // Use custom coordinates if provided
            finalSizeVW = item.size !== undefined ? item.size : (item.isPng ? 15 : 18);
            finalRotation = item.rotation !== undefined ? item.rotation : ((idx % 5) - 2) * 3;
            
            const maxLeftPercent = 100 - finalSizeVW - 5;
            const maxTopPercent = 100 - (finalSizeVW * 0.75) - 5;
            
            finalLeft = item.left !== undefined ? Math.min(item.left, maxLeftPercent) : 
                        Math.min(anchorPoints[idx % anchorPoints.length].left, maxLeftPercent);
            finalTop = item.top !== undefined ? Math.min(item.top, maxTopPercent) : 
                       Math.min(anchorPoints[idx % anchorPoints.length].top, maxTopPercent);
          } else {
            // Fall back to default algorithmic layout
            const anchor = anchorPoints[idx % anchorPoints.length];
            finalRotation = ((idx % 5) - 2) * 3;
            finalSizeVW = item.isPng ? 15 : 18;
            
            const maxLeftPercent = 100 - finalSizeVW - 5;
            const maxTopPercent = 100 - (finalSizeVW * 0.75) - 5;
            
            finalLeft = Math.min(anchor.left, maxLeftPercent);
            finalTop = Math.min(anchor.top, maxTopPercent);
          }
          
          pinboardItem.style.position = 'absolute';
          pinboardItem.style.width = `${finalSizeVW}vw`;
          pinboardItem.style.height = 'auto';
          pinboardItem.style.left = `${finalLeft}%`;
          pinboardItem.style.top = `${finalTop}%`;
          pinboardItem.style.zIndex = item.isPng ? 1350 + idx : 1300 + idx;

          const img = createOptimizedImage(
            item.src,
            item.fallback,
            `Project Asset ${idx + 1}`,
            '',
            'lazy',
            {}
          );
          
          setNaturalAspectRatio(img);
          pinboardItem.appendChild(img);
          gridWrapper.appendChild(pinboardItem);
          makeDraggableAndZoomable(pinboardItem, idx, finalRotation);
        });
      }
    }

    function makeDraggableAndZoomable(element, galleryIdx, customRotation = null) {
      let isItemDragging = false;
      let startX = 0, startY = 0;
      let initialTx = 0, initialTy = 0;
      let dragDistance = 0;
      let dragTicking = false;
      let pendingX = 0, pendingY = 0;

      const rotation = customRotation !== null ? customRotation : ((galleryIdx % 5) - 2) * 3;
      element.style.transform = `rotate(${rotation}deg)`;
      element.dataset.tx = 0;
      element.dataset.ty = 0;

      function startDrag(clientX, clientY) {
        isItemDragging = true;
        dragDistance = 0;
        highestZIndex += 1;
        element.style.zIndex = highestZIndex;
        element.style.transition = 'none';

        startX = clientX;
        startY = clientY;
        initialTx = parseFloat(element.dataset.tx || 0);
        initialTy = parseFloat(element.dataset.ty || 0);
      }

      function moveDrag(clientX, clientY) {
        if (!isItemDragging) return;

        pendingX = clientX;
        pendingY = clientY;

        if (!dragTicking) {
          dragTicking = true;
          requestAnimationFrame(() => {
            const dx = pendingX - startX;
            const dy = pendingY - startY;
            dragDistance += Math.hypot(dx, dy);

            const currentTx = initialTx + dx;
            const currentTy = initialTy + dy;

            element.style.transform = `translate3d(${currentTx}px, ${currentTy}px, 0) rotate(${rotation}deg)`;
            element.dataset.pendingTx = currentTx;
            element.dataset.pendingTy = currentTy;

            dragTicking = false;
          });
        }
      }

      function stopDrag() {
        if (isItemDragging) {
          isItemDragging = false;
          element.style.transition = 'transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), filter 0.25s ease';
          
          if (element.dataset.pendingTx !== undefined) {
            element.dataset.tx = element.dataset.pendingTx;
            element.dataset.ty = element.dataset.pendingTy;
            delete element.dataset.pendingTx;
            delete element.dataset.pendingTy;
          }
        }
      }

      element.addEventListener('click', (e) => {
        if (dragDistance < 5) {
          e.stopPropagation();
          if (pinboardClickBuffer) {
            openLightbox(galleryIdx);
          }
        }
      });

      element.addEventListener('mousedown', (e) => {
        e.stopPropagation();
        startDrag(e.clientX, e.clientY);
      });

      element.addEventListener('touchstart', (e) => {
        if (e.touches.length > 0) {
          e.stopPropagation();
          startDrag(e.touches[0].clientX, e.touches[0].clientY);
        }
      }, { passive: true });

      window.addEventListener('mousemove', (e) => moveDrag(e.clientX, e.clientY));
      window.addEventListener('touchmove', (e) => {
        if (e.touches.length > 0) moveDrag(e.touches[0].clientX, e.touches[0].clientY);
      }, { passive: true });

      window.addEventListener('mouseup', stopDrag);
      window.addEventListener('touchend', stopDrag);
    }

    // Wheel Event Handling with Inertia Dampening & Speed Caps
    window.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (isProjectViewMode) return;
      if (selectedKey !== null) {
        deselectImage();
      }

      let rawDelta = e.deltaY;
      if (e.deltaMode === 1) rawDelta *= 16;
      if (e.deltaMode === 2) rawDelta *= 600;

      const clampedDelta = Math.max(-120, Math.min(120, rawDelta));
      const speedModifier = 0.45; 
      const addedVelocity = -clampedDelta * speedModifier;
      const MAX_VELOCITY = 35;
      
      velocityY = Math.max(-MAX_VELOCITY, Math.min(MAX_VELOCITY, velocityY + addedVelocity));
    }, { passive: false });

    function tick() {
      if (selectedKey !== null && !isProjectViewMode) {
        currentY += (targetY - currentY) * 0.08;
      } else if (!isDragging && !isProjectViewMode) {
        velocityY *= FRICTION;
        
        if (Math.abs(velocityY) < 0.01) {
          velocityY = 0;
          currentY -= baseAutoSpeed;
        } else {
          currentY += velocityY;
        }
      }

      // Zero-stutter architecture: Apply transform to parent container once per frame using integer snapping to avoid sub-pixel tearing
      if (!isProjectViewMode) {
        imageStream.style.transform = `translate3d(0, ${currentY.toFixed(2)}px, 0)`;
      }

      renderVisibleCards();
      requestAnimationFrame(tick);
    }

    function onPointerDown(clientX, clientY) {
      if (isProjectViewMode) return;
      isDragging = true;
      pointerMoved = false;
      startPointerX = clientX;
      startPointerY = clientY;
      lastPointerY = clientY;
      velocityY = 0;
    }

    let pointerTicking = false;
    let pendingPointerX = 0, pendingPointerY = 0;

    function onPointerMove(clientX, clientY) {
      if (!isDragging || isProjectViewMode) return;

      pendingPointerX = clientX;
      pendingPointerY = clientY;

      if (!pointerTicking) {
        pointerTicking = true;
        requestAnimationFrame(() => {
          const totalMovedDist = Math.hypot(pendingPointerX - startPointerX, pendingPointerY - startPointerY);
          const deltaY = (pendingPointerY - lastPointerY) * DRAG_SENSITIVITY;

          if (totalMovedDist > 6) {
            pointerMoved = true;
          }

          currentY += deltaY;
          velocityY = deltaY;
          lastPointerY = pendingPointerY;

          pointerTicking = false;
        });
      }
    }

    function onPointerUp() {
      isDragging = false;
    }

    if (streamContainer) {
      streamContainer.addEventListener('mousedown', (e) => onPointerDown(e.clientX, e.clientY));
      streamContainer.addEventListener('touchstart', (e) => {
        if (e.touches.length > 0) onPointerDown(e.touches[0].clientX, e.touches[0].clientY);
      }, { passive: true });
    }

    window.addEventListener('mousemove', (e) => onPointerMove(e.clientX, e.clientY));
    window.addEventListener('mouseup', onPointerUp);

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) onPointerMove(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    window.addEventListener('touchend', onPointerUp);

    // Global Click Listener for Outside Dismissal
    window.addEventListener('click', (e) => {
      if (isProjectViewMode || selectedKey === null) return;
      if (pointerMoved) return;
      
      const isNavClick = e.target.closest('.top-nav');
      const isBtnClick = e.target.closest('#viewProjectBtn');

      if (!isNavClick && !isBtnClick) {
        deselectImage();
      }
    });

    window.addEventListener('keydown', (e) => {
      if (lightboxModal.classList.contains('is-active')) {
        if (e.key === 'ArrowLeft' && currentGalleryIndex > 0) {
          currentGalleryIndex--;
          updateLightboxView();
        } else if (e.key === 'ArrowRight' && currentGalleryIndex < currentGalleryList.length - 1) {
          currentGalleryIndex++;
          updateLightboxView();
        } else if (e.key === 'Escape') {
          closeLightbox();
        }
      } else if (e.key === 'Escape') {
        if (isProjectViewMode) {
          closeProjectView();
        } else {
          deselectImage();
        }
      }
    });

    window.addEventListener('resize', calculateDimensions);

    document.querySelectorAll('a[href]').forEach(link => {
      link.addEventListener('click', (e) => {
        const href = link.getAttribute('href');

        if (!href || 
            href.startsWith('#') || 
            href.startsWith('javascript:') || 
            href.startsWith('mailto:') || 
            link.target === '_blank' ||
            window.location.pathname.endsWith(href)) {
          return;
        }

        e.preventDefault();
        document.body.classList.add('is-exiting');

        setTimeout(() => {
          window.location.href = href;
        }, 380);
      });
    });

    window.addEventListener('pageshow', (event) => {
      if (event.persisted) {
        document.body.classList.remove('is-exiting');
      }
    });

    updateLeftColumn(defaultLeftContent, false);
    calculateDimensions();
    tick();
  });
</script>

</body>
</html>
