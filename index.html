<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Cole Thompson Portfolio</title>
  
  <!-- Preload critical font -->
  <link rel="preload" href="fonts/HelveticaNowDisplay-Regular.woff2" as="font" type="font/woff2" crossorigin>
  
  <style>
    /* Reset & Base Setup */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      overflow-x: hidden;
      background-color: #000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* Top Navigation */
    .top-nav {
      position: absolute;
      top: 2.2rem;
      left: 2.5rem;
      z-index: 1000;
    }

    .main-nav {
      display: flex;
      gap: 1.5rem;
      font-size: 0.9rem;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.45);
    }

    /* Mobile Menu Toggle Button */
    .mobile-menu-toggle {
      display: none;
      flex-direction: column;
      justify-content: space-around;
      width: 2rem;
      height: 2rem;
      min-width: 44px;
      min-height: 44px;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 0.5rem;
      z-index: 10000;
      position: relative;
    }

    .hamburger-line {
      width: 2rem;
      height: 2px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 2px;
      transition: all 0.3s ease;
      transform-origin: center;
    }

    @media (hover: hover) {
      .mobile-menu-toggle:hover .hamburger-line {
        background: #ffffff;
      }
    }

    .mobile-menu-toggle[aria-expanded="true"] .hamburger-line:nth-child(1) {
      transform: rotate(45deg) translate(5px, 6px);
    }

    .mobile-menu-toggle[aria-expanded="true"] .hamburger-line:nth-child(2) {
      opacity: 0;
      transform: translateX(-10px);
    }

    .mobile-menu-toggle[aria-expanded="true"] .hamburger-line:nth-child(3) {
      transform: rotate(-45deg) translate(5px, -6px);
    }

    /* Mobile Menu Panel */
    .mobile-menu {
      position: fixed;
      top: 0;
      right: 0;
      width: 100%;
      height: 100vh;
      background: rgba(0, 0, 0, 0.98);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .mobile-menu[aria-hidden="false"] {
      opacity: 1;
      visibility: visible;
    }

    .mobile-nav {
      display: flex;
      flex-direction: column;
      gap: 2rem;
      text-align: center;
    }

    .mobile-nav-link {
      font-size: 2rem;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.6);
      text-decoration: none;
      transition: color 0.2s ease, transform 0.2s ease;
      letter-spacing: -0.02em;
      padding: 1rem 1.5rem;
      min-height: 48px;
      min-width: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    @media (hover: hover) {
      .mobile-nav-link:hover {
        color: #ffffff;
        transform: scale(1.05);
      }
    }

    .mobile-nav-link.active {
      color: #ffffff;
    }

    .nav-link {
      transition: color 0.2s ease;
      cursor: pointer;
      padding: 0.5rem 0.75rem;
      min-height: 44px;
      min-width: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    @media (hover: hover) {
      .nav-link:hover {
        color: rgba(255, 255, 255, 0.9);
      }
    }

    .nav-link.active {
      color: rgba(255, 255, 255, 0.9);
    }

    /* Contact Page Layout */
    .contact-page {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    .contact-background {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .contact-bg-image {
      width: 100%;
      height: 100%;
      max-width: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      aspect-ratio: 16/9;
    }

    /* Floating Title Text */
    .contact-content {
      position: absolute;
      top: 22vh;
      left: 65vw;
      z-index: 2;
    }

    .contact-title {
      display: flex;
      flex-direction: column;
      line-height: 0.9;
      letter-spacing: -0.03em;
    }

    .contact-title-italic {
      font-size: clamp(2.5rem, 6vw, 4.8rem);
      font-style: italic;
      font-weight: 300;
      color: rgba(255, 255, 255, 0.92);
      margin-left: 0.2rem;
    }

    .contact-title-normal {
      font-size: clamp(2.5rem, 6vw, 5rem);
      font-weight: 500;
      color: #ffffff;
    }

    /* Responsive adjustment for smaller screens */
    @media (max-width: 900px) {
      .contact-content {
        left: 50vw;
      }
      .contact-title-italic {
        font-size: clamp(2rem, 5vw, 3.5rem);
      }
      .contact-title-normal {
        font-size: clamp(2rem, 5vw, 3.8rem);
      }
    }
    
    /* Mobile-specific adjustments */
    @media (max-width: 767px) {
      .contact-content {
        left: 50%;
        transform: translateX(-50%);
        top: 15vh;
      }
      .contact-title-italic {
        font-size: clamp(1.8rem, 6vw, 2.5rem);
      }
      .contact-title-normal {
        font-size: clamp(1.8rem, 6vw, 2.8rem);
      }
      
      .top-nav {
        top: 1rem;
        left: 1.5rem;
        right: 1.5rem;
      }
      
      .main-nav {
        gap: 1rem;
      }
      
      /* Mobile Navigation */
      .mobile-menu-toggle {
        display: flex;
      }
      
      .main-nav {
        display: none;
      }
      
      /* Ensure header doesn't obscure content */
      html {
        scroll-padding-top: 4rem;
      }
    }
    
    /* Tablet and Desktop - keep desktop navigation visible */
    @media (min-width: 768px) {
      .mobile-menu-toggle {
        display: none;
      }
      
      .mobile-menu {
        display: none;
      }
    }
    
    /* Tablet: 768px – 1023px */
    @media (min-width: 768px) and (max-width: 1023px) {
      .contact-content {
        left: 60vw;
      }
      
      .contact-title-italic {
        font-size: clamp(2.5rem, 4vw, 3.5rem);
      }
      
      .contact-title-normal {
        font-size: clamp(2.5rem, 4vw, 3.8rem);
      }
    }
    
    /* Laptop / Desktop: 1024px – 1439px */
    @media (min-width: 1024px) and (max-width: 1439px) {
      .contact-content {
        left: 62vw;
      }
      
      .contact-title-italic {
        font-size: clamp(3rem, 4vw, 4.2rem);
      }
      
      .contact-title-normal {
        font-size: clamp(3rem, 4vw, 4.5rem);
      }
    }
    
    /* Ultra-Wide / Large Displays: >= 1440px */
    @media (min-width: 1440px) {
      .contact-content {
        left: 65vw;
      }
      
      .contact-title-italic {
        font-size: clamp(3.5rem, 4vw, 4.8rem);
      }
      
      .contact-title-normal {
        font-size: clamp(3.5rem, 4vw, 5rem);
      }
    }

    /* ==========================================================================
       Page Transition Overlay & Keyframes
       ========================================================================== */
    .page-transition-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      z-index: 9999;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Active overlay during transition exit */
    body.is-exiting .page-transition-overlay {
      opacity: 1;
      pointer-events: auto;
    }

    /* Smooth entry animation for main layout content */
    main {
      animation: pageIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes pageIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <div class="page-transition-overlay" id="pageTransitionOverlay"></div>

  <!-- Top Navigation -->
  <header class="top-nav">
    <button 
      class="mobile-menu-toggle" 
      id="mobileMenuToggle" 
      aria-expanded="false" 
      aria-controls="mobileMenu"
      aria-label="Toggle navigation menu"
    >
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
    </button>
    
    <nav class="main-nav" id="mainNav">
      <a href="index.html" class="nav-link active">Contact</a>
      <a href="work.html" class="nav-link">Work</a>
      <a href="fun.html" class="nav-link">Fun</a>
    </nav>
    
    <!-- Mobile Menu Panel -->
    <div class="mobile-menu" id="mobileMenu" aria-hidden="true">
      <nav class="mobile-nav">
        <a href="index.html" class="mobile-nav-link active">Contact</a>
        <a href="work.html" class="mobile-nav-link">Work</a>
        <a href="fun.html" class="mobile-nav-link">Fun</a>
      </nav>
    </div>
  </header>

  <!-- Fullscreen Cover Layout -->
  <main class="contact-page">
    <div class="contact-background">
      <picture>
        <source srcset="images/000097000012.avif" type="image/avif">
        <source srcset="images/000097000012.webp" type="image/webp">
        <img src="images/000097000012.jpg" alt="Mountain landscape" class="contact-bg-image" loading="eager" fetchpriority="high" width="1920" height="1080" />
      </picture>
    </div>
    
    <div class="contact-content">
      <div class="contact-title">
        <span class="contact-title-italic">Design</span>
        <span class="contact-title-normal">Portfolio</span>
      </div>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Mobile Menu Toggle
      const mobileMenuToggle = document.getElementById('mobileMenuToggle');
      const mobileMenu = document.getElementById('mobileMenu');
      const mobileNavLinks = document.querySelectorAll('.mobile-nav-link');
      
      function toggleMobileMenu() {
        const isExpanded = mobileMenuToggle.getAttribute('aria-expanded') === 'true';
        
        mobileMenuToggle.setAttribute('aria-expanded', !isExpanded);
        mobileMenu.setAttribute('aria-hidden', isExpanded);
        
        // Prevent body scroll when menu is open
        document.body.style.overflow = isExpanded ? '' : 'hidden';
      }
      
      function closeMobileMenu() {
        mobileMenuToggle.setAttribute('aria-expanded', 'false');
        mobileMenu.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
      }
      
      if (mobileMenuToggle && mobileMenu) {
        mobileMenuToggle.addEventListener('click', toggleMobileMenu);
        
        // Close menu when clicking on navigation links
        mobileNavLinks.forEach(link => {
          link.addEventListener('click', closeMobileMenu);
        });
        
        // Close menu when clicking outside
        mobileMenu.addEventListener('click', (e) => {
          if (e.target === mobileMenu) {
            closeMobileMenu();
          }
        });
        
        // Close menu on escape key
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape' && mobileMenuToggle.getAttribute('aria-expanded') === 'true') {
            closeMobileMenu();
            mobileMenuToggle.focus();
          }
        });
      }
      
      const overlay = document.getElementById('pageTransitionOverlay');

      // Intercept internal navigation clicks
      document.querySelectorAll('a[href]').forEach(link => {
        link.addEventListener('click', (e) => {
          const href = link.getAttribute('href');

          // Ignore hash links, external links, email links, and current page links
          if (!href || 
              href.startsWith('#') || 
              href.startsWith('javascript:') || 
              href.startsWith('mailto:') || 
              link.target === '_blank' ||
              window.location.pathname.endsWith(href)) {
            return;
          }

          e.preventDefault();

          // Trigger exit animation
          document.body.classList.add('is-exiting');

          // Wait for overlay fade before loading next page
          setTimeout(() => {
            window.location.href = href;
          }, 380);
        });
      });

      // Handle back/forward navigation cache gracefully
      window.addEventListener('pageshow', (event) => {
        if (event.persisted) {
          document.body.classList.remove('is-exiting');
        }
      });
    });
  </script>

</body>
</html>
