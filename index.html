<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home — Cole Thompson</title>
  
  <!-- Preload critical font -->
  <link rel="preload" href="fonts/HelveticaNowDisplay-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    /* ==========================================================================
       1. Reset & Global Setup (Strict Non-Scrolling Viewport)
       ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      position: fixed;
      inset: 0;
      overflow: hidden !important;
      touch-action: none;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Edge-Proximity Glowing Window Outline */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9990;
      border: 1px solid rgba(0, 210, 255, 0.9);
      box-shadow: 
        inset 0 0 10px rgba(0, 210, 255, 0.6),
        inset 0 0 20px rgba(180, 255, 60, 0.4),
        0 0 15px rgba(0, 210, 255, 0.7);
      opacity: var(--edge-glow-opacity, 0);
      transition: opacity 0.2s ease;
      
      -webkit-mask-image: radial-gradient(
        70px circle at var(--bg-mouse-x, 50vw) var(--bg-mouse-y, 50vh),
        black 0%,
        rgba(0, 0, 0, 0.8) 40%,
        transparent 80%
      );
      mask-image: radial-gradient(
        70px circle at var(--bg-mouse-x, 50vw) var(--bg-mouse-y, 50vh),
        black 0%,
        rgba(0, 0, 0, 0.8) 40%,
        transparent 80%
      );
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* ==========================================================================
       2. Fixed Top Navigation
       ========================================================================== */
    .top-nav {
      position: fixed;
      top: 2.2rem;
      left: 2.5rem;
      z-index: 2000;
    }

    .main-nav {
      display: flex;
      gap: 1.5rem;
      font-size: 0.9rem;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.45);
    }

    /* Mobile Menu Toggle Button */
    .mobile-menu-toggle {
      display: none;
      flex-direction: column;
      justify-content: space-between;
      width: 2rem;
      height: 2rem;
      min-width: 44px;
      min-height: 44px;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 0.5rem;
      z-index: 2001;
      position: relative;
      flex-shrink: 0;
    }

    .hamburger-line {
      width: 100%;
      height: 2px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 2px;
      transition: all 0.3s ease;
      transform-origin: center;
      flex-shrink: 0;
      display: block;
    }

    @media (hover: hover) {
      .mobile-menu-toggle:hover .hamburger-line {
        background: #ffffff;
      }
    }

    .mobile-menu-toggle[aria-expanded="true"] .hamburger-line:nth-child(1) {
      transform: rotate(45deg) translate(5px, 6px);
    }

    .mobile-menu-toggle[aria-expanded="true"] .hamburger-line:nth-child(2) {
      opacity: 0;
      transform: translateX(-10px);
    }

    .mobile-menu-toggle[aria-expanded="true"] .hamburger-line:nth-child(3) {
      transform: rotate(-45deg) translate(5px, -6px);
    }

    /* Mobile Menu Panel */
    .mobile-menu {
      position: fixed;
      top: 0;
      right: 0;
      width: 100%;
      height: 100vh;
      background: rgba(0, 0, 0, 0.98);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .mobile-menu[aria-hidden="false"] {
      opacity: 1;
      visibility: visible;
    }

    .mobile-nav {
      display: flex;
      flex-direction: column;
      gap: 2rem;
      text-align: center;
    }

    .mobile-nav-link {
      font-size: 2rem;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.6);
      text-decoration: none;
      transition: color 0.2s ease, transform 0.2s ease;
      letter-spacing: -0.02em;
      padding: 1rem 1.5rem;
      min-height: 48px;
      min-width: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    @media (hover: hover) {
      .mobile-nav-link:hover {
        color: #ffffff;
        transform: scale(1.05);
      }
    }

    .mobile-nav-link.active {
      color: #ffffff;
    }

    .nav-link {
      transition: color 0.2s ease, text-shadow 0.3s ease;
      cursor: pointer;
      position: relative;
    }

    @media (hover: hover) {
      .nav-link:hover {
        color: #ffffff;
        text-shadow: 0 0 12px rgba(0, 210, 255, 0.8), 0 0 20px rgba(180, 255, 60, 0.6);
      }
    }

    .nav-link.active {
      color: rgba(255, 255, 255, 0.9);
    }

    /* Fullscreen Cover Layout */
    .contact-page {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .contact-background {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* Dark gradient scrim overlay to maintain high text contrast over video */
    .contact-background::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 20% 30%, rgba(0, 0, 0, 0.4) 0%, rgba(0, 0, 0, 0.75) 100%);
      z-index: 2;
      pointer-events: none;
    }

    .contact-bg-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .contact-bg-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    /* Respect user motion preferences */
    @media (prefers-reduced-motion: reduce) {
      .contact-bg-video {
        display: none;
      }
      .contact-background {
        background-image: url('images/000097000012.jpg');
        background-size: cover;
        background-position: center;
      }
    }

    .home-content {
      position: absolute;
      top: clamp(7rem, 16vh, 11rem);
      left: clamp(2rem, 5vw, 5rem);
      max-width: clamp(320px, 32vw, 480px);
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .home-title {
      font-size: clamp(2.5rem, 5vw, 4rem);
      font-weight: 500;
      letter-spacing: -0.02em;
      line-height: 1.05;
      color: #ffffff;
      margin: 0;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }

    .home-description {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .home-description p {
      font-size: 0.825rem;
      line-height: 1.55;
      color: #d1d1d1;
      font-weight: 400;
      letter-spacing: -0.01em;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.6);
    }

    /* Responsive adjustment for smaller screens */
    @media (max-width: 900px) {
      .home-content {
        top: clamp(6rem, 14vh, 9rem);
        left: clamp(1.5rem, 4vw, 3rem);
        max-width: clamp(280px, 35vw, 400px);
      }
    }
    
    /* Mobile-specific adjustments */
    @media (max-width: 767px) {
      .home-content {
        top: 6rem;
        left: 1.5rem;
        right: 1.5rem;
        max-width: calc(100vw - 3rem);
      }

      .top-nav {
        top: 1rem;
        left: 1.25rem;
        right: 1.25rem;
      }
      
      .mobile-menu-toggle {
        display: flex;
      }
      
      .main-nav {
        display: none;
      }
    }
  </style>
</head>
<body>

  <div class="page-transition-overlay" id="pageTransitionOverlay"></div>

  <!-- Top Navigation -->
  <header class="top-nav">
    <button 
      class="mobile-menu-toggle" 
      id="mobileMenuToggle" 
      aria-expanded="false" 
      aria-controls="mobileMenu"
      aria-label="Toggle navigation menu"
    >
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
    </button>
    
    <nav class="main-nav" id="mainNav">
      <a href="index.html" class="nav-link active">Home</a>
      <a href="work.html" class="nav-link">Work</a>
      <a href="contact.html" class="nav-link">Contact</a>
      <a href="fun.html" class="nav-link">Fun</a>
    </nav>
    
    <!-- Mobile Menu Panel -->
    <div class="mobile-menu" id="mobileMenu" aria-hidden="true">
      <nav class="mobile-nav">
        <a href="index.html" class="mobile-nav-link active">Home</a>
        <a href="work.html" class="mobile-nav-link">Work</a>
        <a href="contact.html" class="mobile-nav-link">Contact</a>
        <a href="fun.html" class="mobile-nav-link">Fun</a>
      </nav>
    </div>
  </header>

  <!-- Fullscreen Cover Layout -->
  <main class="contact-page">
    <div class="contact-background">
      <video 
        class="contact-bg-video" 
        id="bgVideo"
        autoplay 
        loop 
        muted 
        playsinline 
        webkit-playsinline
        preload="auto"
        poster="images/000097000012.jpg"
      >
        <source src="images/Run2.mp4" type="video/mp4" />
        <!-- Fallback image if video fails to load or unsupported -->
        <img src="images/000097000012.jpg" alt="Background fallback" class="contact-bg-image" />
      </video>
    </div>

    <div class="home-content">
      <h1 class="home-title">Cole Thompson Design</h1>
      <div class="home-description">
        <p>
          This is my work
        </p>
        <p>
        </p>
      </div>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Background Video Autoplay Enforcement for Mobile / Low Power Modes
      const bgVideo = document.getElementById('bgVideo');
      if (bgVideo) {
        const attemptPlay = () => {
          bgVideo.play().catch(() => {
            // Re-attempt play on first user interaction if blocked by battery-saver policy
            const handleTouch = () => {
              bgVideo.play().catch(() => {});
              window.removeEventListener('touchstart', handleTouch);
              window.removeEventListener('click', handleTouch);
            };
            window.addEventListener('touchstart', handleTouch, { passive: true });
            window.addEventListener('click', handleTouch, { passive: true });
          });
        };
        attemptPlay();
      }

      // Mobile Menu Toggle
      const mobileMenuToggle = document.getElementById('mobileMenuToggle');
      const mobileMenu = document.getElementById('mobileMenu');
      const mobileNavLinks = document.querySelectorAll('.mobile-nav-link');
      
      function toggleMobileMenu() {
        const isExpanded = mobileMenuToggle.getAttribute('aria-expanded') === 'true';
        
        mobileMenuToggle.setAttribute('aria-expanded', !isExpanded);
        mobileMenu.setAttribute('aria-hidden', isExpanded);
        
        document.body.style.overflow = isExpanded ? '' : 'hidden';
      }
      
      function closeMobileMenu() {
        mobileMenuToggle.setAttribute('aria-expanded', 'false');
        mobileMenu.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
      }
      
      if (mobileMenuToggle && mobileMenu) {
        mobileMenuToggle.addEventListener('click', toggleMobileMenu);
        mobileNavLinks.forEach(link => link.addEventListener('click', closeMobileMenu));
        
        mobileMenu.addEventListener('click', (e) => {
          if (e.target === mobileMenu) closeMobileMenu();
        });
        
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape' && mobileMenuToggle.getAttribute('aria-expanded') === 'true') {
            closeMobileMenu();
            mobileMenuToggle.focus();
          }
        });
      }
      
      const EDGE_THRESHOLD = 90;

      // Mouse tracking & Edge glow
      window.addEventListener('mousemove', (e) => {
        document.body.style.setProperty('--bg-mouse-x', `${e.clientX}px`);
        document.body.style.setProperty('--bg-mouse-y', `${e.clientY}px`);

        const minEdgeDist = Math.min(e.clientX, window.innerWidth - e.clientX, e.clientY, window.innerHeight - e.clientY);

        if (minEdgeDist < EDGE_THRESHOLD) {
          const edgeFactor = 1 - (minEdgeDist / EDGE_THRESHOLD);
          document.body.style.setProperty('--edge-glow-opacity', edgeFactor.toFixed(2));
        } else {
          document.body.style.setProperty('--edge-glow-opacity', '0');
        }
      });
    });
  </script>
</body>
</html>
