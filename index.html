<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Cole Thompson</title>
  
  <!-- Preload critical font -->
  <link rel="preload" href="fonts/HelveticaNowDisplay-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    /* ==========================================================================
       1. Reset & Global Setup (Strict Non-Scrolling Viewport)
       ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      position: fixed;
      inset: 0;
      overflow: hidden !important;
      touch-action: none;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Edge-Proximity Glowing Window Outline */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9990;
      border: 1px solid rgba(0, 210, 255, 0.9);
      box-shadow: 
        inset 0 0 10px rgba(0, 210, 255, 0.6),
        inset 0 0 20px rgba(180, 255, 60, 0.4),
        0 0 15px rgba(0, 210, 255, 0.7);
      opacity: var(--edge-glow-opacity, 0);
      transition: opacity 0.2s ease;
      
      -webkit-mask-image: radial-gradient(
        70px circle at var(--bg-mouse-x, 50vw) var(--bg-mouse-y, 50vh),
        black 0%,
        rgba(0, 0, 0, 0.8) 40%,
        transparent 80%
      );
      mask-image: radial-gradient(
        70px circle at var(--bg-mouse-x, 50vw) var(--bg-mouse-y, 50vh),
        black 0%,
        rgba(0, 0, 0, 0.8) 40%,
        transparent 80%
      );
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* ==========================================================================
       2. Fixed Top Navigation
       ========================================================================== */
    .top-nav {
      position: fixed;
      top: 2.2rem;
      left: 2.5rem;
      z-index: 2000;
    }

    .main-nav {
      display: flex;
      gap: 1.5rem;
      font-size: 0.9rem;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.45);
    }

    /* Mobile Menu Toggle Button */
    .mobile-menu-toggle {
      display: none;
      flex-direction: column;
      justify-content: space-between;
      width: 2rem;
      height: 2rem;
      min-width: 44px;
      min-height: 44px;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 0.5rem;
      z-index: 2001;
      position: relative;
      flex-shrink: 0;
    }

    .hamburger-line {
      width: 100%;
      height: 2px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 2px;
      transition: all 0.3s ease;
      transform-origin: center;
      flex-shrink: 0;
      display: block;
    }

    @media (hover: hover) {
      .mobile-menu-toggle:hover .hamburger-line {
        background: #ffffff;
      }
    }

    .mobile-menu-toggle[aria-expanded="true"] .hamburger-line:nth-child(1) {
      transform: rotate(45deg) translate(5px, 6px);
    }

    .mobile-menu-toggle[aria-expanded="true"] .hamburger-line:nth-child(2) {
      opacity: 0;
      transform: translateX(-10px);
    }

    .mobile-menu-toggle[aria-expanded="true"] .hamburger-line:nth-child(3) {
      transform: rotate(-45deg) translate(5px, -6px);
    }

    /* Mobile Menu Panel */
    .mobile-menu {
      position: fixed;
      top: 0;
      right: 0;
      width: 100%;
      height: 100vh;
      background: rgba(0, 0, 0, 0.98);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .mobile-menu[aria-hidden="false"] {
      opacity: 1;
      visibility: visible;
    }

    .mobile-nav {
      display: flex;
      flex-direction: column;
      gap: 2rem;
      text-align: center;
    }

    .mobile-nav-link {
      font-size: 2rem;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.6);
      text-decoration: none;
      transition: color 0.2s ease, transform 0.2s ease;
      letter-spacing: -0.02em;
      padding: 1rem 1.5rem;
      min-height: 48px;
      min-width: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    @media (hover: hover) {
      .mobile-nav-link:hover {
        color: #ffffff;
        transform: scale(1.05);
      }
    }

    .mobile-nav-link.active {
      color: #ffffff;
    }

    .nav-link {
      transition: color 0.2s ease, text-shadow 0.3s ease;
      cursor: pointer;
      position: relative;
    }

    @media (hover: hover) {
      .nav-link:hover {
        color: #ffffff;
        text-shadow: 0 0 12px rgba(0, 210, 255, 0.8), 0 0 20px rgba(180, 255, 60, 0.6);
      }
    }

    .nav-link.active {
      color: rgba(255, 255, 255, 0.9);
    }

    /* Fullscreen Cover Layout */
    .contact-page {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .contact-background {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .contact-bg-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .contact-content {
      position: absolute;
      top: 22vh;
      left: 65vw;
      z-index: 2;
    }

    .contact-title {
      display: flex;
      flex-direction: column;
      line-height: 0.9;
      letter-spacing: -0.03em;
    }

    .contact-title-italic {
      font-size: clamp(2.5rem, 6vw, 4.8rem);
      font-style: italic;
      font-weight: 300;
      color: rgba(255, 255, 255, 0.92);
      margin-left: 0.2rem;
    }

    .contact-title-normal {
      font-size: clamp(2.5rem, 6vw, 5rem);
      font-weight: 500;
      color: #ffffff;
    }

    /* Responsive adjustment for smaller screens */
    @media (max-width: 900px) {
      .contact-content {
        left: 50vw;
      }
      .contact-title-italic {
        font-size: clamp(2rem, 5vw, 3.5rem);
      }
      .contact-title-normal {
        font-size: clamp(2rem, 5vw, 3.8rem);
      }
    }
    
    /* Mobile-specific adjustments */
    @media (max-width: 767px) {
      .contact-content {
        left: 50%;
        transform: translateX(-50%);
        top: 15vh;
      }
      .contact-title-italic {
        font-size: clamp(1.8rem, 4vw, 2.5rem);
      }
      .contact-title-normal {
        font-size: clamp(1.8rem, 4vw, 2.8rem);
      }
    }

    .contact-email {
      margin-top: 2rem;
      font-size: clamp(1rem, 1.5vw, 1.25rem);
      font-weight: 400;
      color: rgba(255, 255, 255, 0.85);
    }

    .contact-email a {
      color: rgba(255, 255, 255, 0.9);
      text-decoration: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.4);
      transition: border-color 0.2s ease, color 0.2s ease;
    }

    @media (hover: hover) {
      .contact-email a:hover {
        color: #ffffff;
        border-color: #ffffff;
      }
    }

    /* ==========================================================================
       3. Main Layout Structure
       ========================================================================== */
    .portfolio-layout {
      display: flex;
      width: 100%;
      max-width: min(1600px, 95vw);
      margin: 0 auto;
      height: 100vh;
      position: relative;
      transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: auto;
      overflow: visible;
    }

    .content-left {
      width: clamp(45%, 50%, 52%);
      height: 100%;
      padding: clamp(4rem, 6vw, 7rem) clamp(2rem, 4vw, 4rem) clamp(2rem, 3vw, 3rem) 2.5rem;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: clamp(2rem, 4vw, 3.5rem);
      z-index: 10;
      transition: opacity 0.5s ease;
    }

    .content-right {
      width: clamp(45%, 50%, 48%);
      height: 100%;
      position: relative;
      overflow: visible;
      perspective: 1400px;
      z-index: 20;
    }

    /* ==========================================================================
       4. Left Column Typography & Subtitles
       ========================================================================== */
    .hero-container {
      min-height: 120px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      transition: opacity 0.2s ease;
    }

    .name {
      font-size: clamp(2.5rem, 5vw, 4.2rem);
      font-weight: 500;
      letter-spacing: -0.02em;
      line-height: 1.05;
      margin-bottom: 0;
      color: #ffffff;
    }

    .click-hint,
    .go-back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.75rem;
      padding: 0.5rem 0.75rem;
      font-size: 0.9rem;
      font-weight: 400;
      font-family: inherit;
      color: #ffffff;
      background: transparent;
      border: none;
      cursor: pointer;
      width: fit-content;
      min-height: 44px;
      min-width: 44px;
      transition: opacity 0.2s ease, transform 0.2s ease, text-shadow 0.3s ease;
      box-shadow: none;
      text-decoration: underline;
      text-underline-offset: 4px;
      text-decoration-thickness: 1px;
      position: relative;
      z-index: 1000 !important;
      pointer-events: auto !important;
    }

    .click-hint {
      cursor: default;
    }

    .click-hint.hidden {
      display: none;
    }

    .go-back-btn {
      display: none;
    }

    .go-back-btn.visible {
      display: inline-flex;
    }

    @media (hover: hover) {
      .click-hint:hover,
      .go-back-btn:hover {
        opacity: 1;
        transform: translateY(-1px);
        text-shadow: 0 0 10px rgba(0, 210, 255, 0.9), 0 0 18px rgba(180, 255, 60, 0.7);
      }
    }

    .sections-container {
      display: flex;
      flex-direction: column;
      gap: 2.5rem;
      max-width: 100%;
      align-self: flex-start;
    }

    .section-grid {
      display: grid;
      grid-template-columns: 1fr clamp(100px, 12vw, 160px);
      gap: 2rem;
      align-items: start;
      max-width: 100%;
      transition: opacity 0.2s ease;
    }

    .section-content {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      font-size: 0.825rem;
      line-height: 1.5;
      color: #a1a1a1;
      font-weight: 400;
      user-select: text;
      -webkit-user-select: text;
    }

    .section-label {
      font-size: 0.825rem;
      font-weight: 500;
      color: #ffffff;
      text-align: left;
      letter-spacing: -0.01em;
    }

    .contact-email {
      font-size: 1.25rem;
      font-weight: 400;
      margin-top: auto;
    }

    .contact-email a {
      text-decoration: underline;
      text-underline-offset: 6px;
      text-decoration-thickness: 1px;
      color: #ffffff;
      transition: opacity 0.2s ease, text-shadow 0.3s ease;
    }

    @media (hover: hover) {
      .contact-email a:hover {
        opacity: 1;
        text-shadow: 0 0 12px rgba(0, 210, 255, 0.8), 0 0 20px rgba(180, 255, 60, 0.6);
      }
    }

    /* ==========================================================================
       5. 3D Stream Layout & Hover Effects
       ========================================================================== */
    .image-stream-container {
      position: absolute;
      top: -20vh;
      right: -5vw;
      width: 110%;
      height: 140vh;
      transform-style: preserve-3d;
      transform: rotateZ(8deg) rotateY(-18deg) rotateX(4deg);
      transform-origin: top right;
      cursor: grab;
      z-index: 60;
      will-change: transform;
    }

    .image-stream-container:active {
      cursor: grabbing;
    }

    .image-stream {
      position: relative;
      width: 100%;
      height: 100%;
      will-change: transform;
      transform-style: preserve-3d;
    }

    .stream-card {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      background-color: transparent;
      cursor: pointer;
      transform-style: preserve-3d;
      will-change: transform, box-shadow, opacity;
      transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1), 
                  box-shadow 0.45s cubic-bezier(0.16, 1, 0.3, 1),
                  opacity 0.4s ease;
      z-index: 10;
      opacity: 1 !important;
      pointer-events: auto;
      padding: 0px;
    }

    .stream-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
      box-shadow: -10px 20px 40px rgba(0, 0, 0, 0.8);
      border-radius: 6px;
      border: 1px solid transparent;
      transform-style: preserve-3d;
      will-change: transform, border-color, box-shadow;
      transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1), 
                  border-color 0.35s ease,
                  box-shadow 0.35s ease;
      transform-origin: center center;
      z-index: 2;
    }

    /* Gradient Bloom Backdrop */
    .stream-card::before {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 10px;
      background: radial-gradient(
        circle at 50% 50%,
        rgba(220, 255, 60, 0.85) 0%,
        rgba(0, 210, 255, 0.75) 35%,
        rgba(0, 80, 255, 0.5) 65%,
        transparent 85%
      );
      filter: blur(28px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
      z-index: -1;
    }

    @media (hover: hover) {
      .stream-card:hover::before {
        opacity: 1;
      }

      .stream-card:hover .stream-card-inner {
        border-color: rgba(0, 210, 255, 0.85);
        box-shadow: 
          -15px 30px 60px rgba(0, 0, 0, 0.9),
          0 0 30px rgba(0, 210, 255, 0.4),
          0 0 55px rgba(180, 255, 0, 0.3);
      }
    }

    .stream-card.is-hovered .stream-card-inner {
      transform: scale(1.02);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.3s ease;
    }

    /* Card Text Overlay */
    .card-overlay-text {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 2.5rem 1.25rem 1.25rem 1.25rem;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.92) 0%, rgba(0, 0, 0, 0.5) 60%, transparent 100%);
      color: #ffffff;
      pointer-events: none;
      z-index: 15;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      text-align: left;
    }

    .card-overlay-title {
      font-size: clamp(1.1rem, 2vw, 1.5rem);
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
    }

    .card-overlay-desc {
      font-size: clamp(0.75rem, 1.2vw, 0.875rem);
      color: rgba(255, 255, 255, 0.8);
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      font-weight: 400;
    }

    .card-action-badge {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #ffffff;
      font-size: 0.75rem;
      font-weight: 500;
      padding: 0.4rem 0.8rem;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      opacity: 0;
      transform: translateY(-6px);
      transition: opacity 0.25s ease, transform 0.25s ease;
      pointer-events: none;
      z-index: 20;
    }

    @media (hover: hover) {
      .stream-card:hover .card-action-badge {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes borderPulse {
      0% {
        box-shadow: -15px 25px 50px rgba(0, 0, 0, 0.9), 0 0 20px rgba(0, 210, 255, 0.5);
      }
      50% {
        box-shadow: -20px 35px 65px rgba(0, 0, 0, 0.95), 0 0 40px rgba(180, 255, 0, 0.5);
      }
      100% {
        box-shadow: -15px 25px 50px rgba(0, 0, 0, 0.9), 0 0 20px rgba(0, 210, 255, 0.5);
      }
    }

    .stream-card.is-selected .stream-card-inner {
      animation: borderPulse 2s infinite ease-in-out;
    }

    .stream-card.is-selected {
      z-index: 50;
    }

    .stream-image {
      width: 100%;
      height: 100%;
      max-width: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    /* ==========================================================================
       6. Mobile Specific Viewport Adjustments (< 768px)
       ========================================================================== */
    @media (max-width: 767px) {
      .portfolio-layout {
        flex-direction: column;
      }
      
      .content-left {
        display: none !important;
      }
      
      .content-right {
        width: 100%;
        display: block !important;
        height: 100vh;
        perspective: 900px;
      }

      .image-stream-container {
        top: 0;
        right: 0;
        width: 100vw;
        height: 100vh;
        transform: rotateZ(2deg) rotateY(-8deg) rotateX(2deg);
        transform-origin: center center;
      }

      .stream-card {
        padding: 6px;
      }

      .card-action-badge {
        opacity: 1;
        transform: translateY(0);
        font-size: 0.7rem;
        padding: 0.3rem 0.6rem;
      }

      .top-nav {
        top: 1rem;
        left: 1.25rem;
        right: 1.25rem;
      }
      
      .mobile-menu-toggle {
        display: flex;
      }
      
      .main-nav {
        display: none;
      }
    }

<body>

  <div class="page-transition-overlay" id="pageTransitionOverlay"></div>

  <!-- Top Navigation -->
  <header class="top-nav">
    <button 
      class="mobile-menu-toggle" 
      id="mobileMenuToggle" 
      aria-expanded="false" 
      aria-controls="mobileMenu"
      aria-label="Toggle navigation menu"
    >
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
    </button>
    
    <nav class="main-nav" id="mainNav">
      <a href="work.html" class="nav-link">Work</a>
      <a href="contact.html" class="nav-link active">Contact</a>
      <a href="fun.html" class="nav-link">Fun</a>
    </nav>
    
    <!-- Mobile Menu Panel -->
    <div class="mobile-menu" id="mobileMenu" aria-hidden="true">
      <nav class="mobile-nav">
        <a href="work.html" class="mobile-nav-link">Work</a>
        <a href="contact.html" class="mobile-nav-link active">Contact</a>
        <a href="fun.html" class="mobile-nav-link">Fun</a>
      </nav>
    </div>
  </header>

  <!-- Fullscreen Cover Layout -->
  <main class="contact-page">
    <div class="contact-background">
      <picture>
        <source srcset="images/000097000012.avif" type="image/avif">
        <source srcset="images/000097000012.webp" type="image/webp">
        <img src="images/000097000012.jpg" alt="Mountain landscape" class="contact-bg-image" loading="eager" fetchpriority="high" width="1920" height="1080" />
      </picture>
    </div>

    <div class="contact-content">
      <div class="contact-title">
        <span class="contact-title-italic">Design</span>
        <span class="contact-title-normal">Portfolio</span>
      </div>
      
      <p class="contact-email">
        <a href="mailto:colejthompson33@gmail.com">colejthompson33@gmail.com</a>
      </p>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Mobile Menu Toggle
      const mobileMenuToggle = document.getElementById('mobileMenuToggle');
      const mobileMenu = document.getElementById('mobileMenu');
      const mobileNavLinks = document.querySelectorAll('.mobile-nav-link');
      
      function toggleMobileMenu() {
        const isExpanded = mobileMenuToggle.getAttribute('aria-expanded') === 'true';
        
        mobileMenuToggle.setAttribute('aria-expanded', !isExpanded);
        mobileMenu.setAttribute('aria-hidden', isExpanded);
        
        // Prevent body scroll when menu is open
        document.body.style.overflow = isExpanded ? '' : 'hidden';
      }
      
      function closeMobileMenu() {
        mobileMenuToggle.setAttribute('aria-expanded', 'false');
        mobileMenu.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
      }
      
      if (mobileMenuToggle && mobileMenu) {
        mobileMenuToggle.addEventListener('click', toggleMobileMenu);
        
        // Close menu when clicking on navigation links
        mobileNavLinks.forEach(link => link.addEventListener('click', closeMobileMenu));
        
        // Close menu when clicking outside
        mobileMenu.addEventListener('click', (e) => {
          if (e.target === mobileMenu) closeMobileMenu();
        });
        
        // Close menu on Escape key
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape' && mobileMenuToggle.getAttribute('aria-expanded') === 'true') {
            closeMobileMenu();
            mobileMenuToggle.focus();
          }
        });
      }
      
      const EDGE_THRESHOLD = 90;

      // Mouse tracking & Edge glow
      window.addEventListener('mousemove', (e) => {
        document.body.style.setProperty('--bg-mouse-x', `${e.clientX}px`);
        document.body.style.setProperty('--bg-mouse-y', `${e.clientY}px`);

        const minEdgeDist = Math.min(e.clientX, window.innerWidth - e.clientX, e.clientY, window.innerHeight - e.clientY);

        if (minEdgeDist < EDGE_THRESHOLD) {
          const edgeFactor = 1 - (minEdgeDist / EDGE_THRESHOLD);
          document.body.style.setProperty('--edge-glow-opacity', edgeFactor.toFixed(2));
        } else {
          document.body.style.setProperty('--edge-glow-opacity', '0');
        }
      });
    });
  </script>
</body>
