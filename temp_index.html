<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Cole Thompson</title>
  
  <!-- Preload critical font -->
  <link rel="preload" href="fonts/HelveticaNowDisplay-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    /* ==========================================================================
       1. Reset & Global Setup (Strict Non-Scrolling Viewport)
       ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      position: fixed;
      inset: 0;
      overflow: hidden !important;
      touch-action: none;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Edge-Proximity Glowing Window Outline */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9990;
      border: 1px solid rgba(0, 210, 255, 0.9);
      box-shadow: 
        inset 0 0 10px rgba(0, 210, 255, 0.6),
        inset 0 0 20px rgba(180, 255, 60, 0.4),
        0 0 15px rgba(0, 210, 255, 0.7);
      opacity: var(--edge-glow-opacity, 0);
      transition: opacity 0.2s ease;
      
      -webkit-mask-image: radial-gradient(
        70px circle at var(--bg-mouse-x, 50vw) var(--bg-mouse-y, 50vh),
        black 0%,
        rgba(0, 0, 0, 0.8) 40%,
        transparent 80%
      );
      mask-image: radial-gradient(
        70px circle at var(--bg-mouse-x, 50vw) var(--bg-mouse-y, 50vh),
        black 0%,
        rgba(0, 0, 0, 0.8) 40%,
        transparent 80%
      );
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* ==========================================================================
       2. Fixed Top Navigation
       ========================================================================== */
    .top-nav {
      position: fixed;
      top: 2.2rem;
      left: 2.5rem;
      z-index: 2000;
    }

    .main-nav {
      display: flex;
      gap: 1.2rem;
      font-size: 0.9rem;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.45);
    }

    /* Mobile Menu Toggle Button */
    .mobile-menu-toggle {
      display: none;
      flex-direction: column;
      justify-content: space-between;
      width: 2rem;
      height: 2rem;
      min-width: 44px;
      min-height: 44px;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 0.5rem;
      z-index: 2001;
      position: relative;
      flex-shrink: 0;
    }

    .hamburger-line {
      width: 100%;
      height: 2px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 2px;
      transition: all 0.3s ease;
      transform-origin: center;
      flex-shrink: 0;
      display: block;
    }

    @media (hover: hover) {
      .mobile-menu-toggle:hover .hamburger-line {
        background: #ffffff;
      }
    }

    .mobile-menu-toggle[aria-expanded="true"] .hamburger-line:nth-child(1) {
      transform: rotate(45deg) translate(5px, 6px);
    }

    .mobile-menu-toggle[aria-expanded="true"] .hamburger-line:nth-child(2) {
      opacity: 0;
      transform: translateX(-10px);
    }

    .mobile-menu-toggle[aria-expanded="true"] .hamburger-line:nth-child(3) {
      transform: rotate(-45deg) translate(5px, -6px);
    }

    /* Mobile Menu Panel */
    .mobile-menu {
      position: fixed;
      top: 0;
      right: 0;
      width: 100%;
      height: 100vh;
      background: rgba(0, 0, 0, 0.98);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .mobile-menu[aria-hidden="false"] {
      opacity: 1;
      visibility: visible;
    }

    .mobile-nav {
      display: flex;
      flex-direction: column;
      gap: 2rem;
      text-align: center;
    }

    .mobile-nav-link {
      font-size: 2rem;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.6);
      text-decoration: none;
      transition: color 0.2s ease, transform 0.2s ease;
      letter-spacing: -0.02em;
      padding: 1rem 1.5rem;
      min-height: 48px;
      min-width: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    @media (hover: hover) {
      .mobile-nav-link:hover {
        color: #ffffff;
        transform: scale(1.05);
      }
    }

    .mobile-nav-link.active {
      color: #ffffff;
    }

    .nav-link {
      transition: color 0.2s ease, text-shadow 0.3s ease;
      cursor: pointer;
      position: relative;
    }

    @media (hover: hover) {
      .nav-link:hover {
        color: #ffffff;
        text-shadow: 0 0 12px rgba(0, 210, 255, 0.8), 0 0 20px rgba(180, 255, 60, 0.6);
      }
    }

    .nav-link.active {
      color: rgba(255, 255, 255, 0.9);
    }

    /* Fullscreen Cover Layout */
    .contact-page {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .contact-background {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .contact-bg-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .contact-content {
      position: absolute;
      top: 22vh;
      left: 65vw;
      z-index: 2;
    }

    .contact-title {
      display: flex;
      flex-direction: column;
      line-height: 0.9;
      letter-spacing: -0.03em;
    }

    .contact-title-italic {
      font-size: clamp(2.5rem, 6vw, 4.8rem);
      font-style: italic;
      font-weight: 300;
      color: rgba(255, 255, 255, 0.92);
      margin-left: 0.2rem;
    }

    .contact-title-normal {
      font-size: clamp(2.5rem, 6vw, 5rem);
      font-weight: 500;
      color: #ffffff;
    }

    /* Responsive adjustment for smaller screens */
    @media (max-width: 900px) {
      .contact-content {
        left: 50vw;
      }
      .contact-title-italic {
        font-size: clamp(2rem, 5vw, 3.5rem);
      }
      .contact-title-normal {
        font-size: clamp(2rem, 5vw, 3.8rem);
      }
    }
    
    /* Mobile-specific adjustments */
    @media (max-width: 767px) {
      .contact-content {
        left: 50%;
        transform: translateX(-50%);
        top: 15vh;
      }
      .contact-title-italic {
        font-size: clamp(1.8rem, 4vw, 2.5rem);
      }
      .contact-title-normal {
        font-size: clamp(1.8rem, 4vw, 2.8rem);
      }
    }

    .contact-email {
      margin-top: 2rem;
      font-size: clamp(1rem, 1.5vw, 1.25rem);
      font-weight: 400;
